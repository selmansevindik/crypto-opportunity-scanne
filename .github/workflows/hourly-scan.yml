name: Hourly Crypto Scan

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scanner.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/hourly-scan.yml"

permissions:
  contents: write

concurrency:
  group: crypto-hourly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test Telegram connection
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "import scanner; ok=scanner.send_telegram('✅ Crypto Opportunity Scanner bağlantısı başarılı. Saatlik tarayıcı aktif.'); raise SystemExit(0 if ok else 2)"
      - name: Run scanner
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      - name: Persist scan state
        run: |
          git config user.name "crypto-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f state/latest.json
          git diff --cached --quiet || git commit -m "chore: update hourly scan state"
          git push
